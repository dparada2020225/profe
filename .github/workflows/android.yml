name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Contenido del curso actualizado
        run: |
          python3 tools/curriculum/build.py
          git diff --exit-code app/src/main/assets/curriculum || (echo "::error::Corre python3 tools/curriculum/build.py y sube el JSON" && exit 1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias y APK
        run: |
          mkdir -p out
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee out/build.log

      - name: Lint (informativo)
        run: ./gradlew --no-daemon lintDebug 2>&1 | tail -30 > out/lint-summary.txt
        continue-on-error: true

      - name: Verificar APIs gratuitas que usa la app
        if: always()
        continue-on-error: true
        run: |
          {
            echo "== dictionaryapi"; curl -sS -w "\nHTTP %{http_code}\n" https://api.dictionaryapi.dev/api/v2/entries/en/achieve | head -c 800; echo
            echo "== tatoeba"; curl -sS -w "\nHTTP %{http_code}\n" "https://tatoeba.org/eng/api_v0/search?from=eng&to=spa&query=%3Dachieve&trans_filter=limit&trans_to=spa&sort=relevance" | head -c 2500; echo
            echo "== mymemory"; curl -sS -w "\nHTTP %{http_code}\n" "https://api.mymemory.translated.net/get?q=achieve&langpair=en%7Ces" | head -c 500; echo
            echo "== languagetool"; curl -sS -w "\nHTTP %{http_code}\n" -d "text=She go to school yesterday." -d "language=en-US" https://api.languagetool.org/v2/check | head -c 800; echo
            echo "== groq (sin key, se espera 401)"; curl -sS -w "\nHTTP %{http_code}\n" https://api.groq.com/openai/v1/models | head -c 300; echo
          } > out/apis.txt 2>&1

      - name: Resumen de pruebas
        if: always()
        run: |
          python3 - <<'PY' > out/tests.txt
          import glob, xml.etree.ElementTree as ET
          total = fail = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              t, fl = int(r.get("tests")), int(r.get("failures")) + int(r.get("errors"))
              total += t; fail += fl
              print(f"{r.get('name')}: {t} pruebas, {fl} fallas")
              for tc in r.iter("testcase"):
                  for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                      print("  FALLA", tc.get("name"), (bad.get("message") or "")[:300])
          print(f"TOTAL: {total} pruebas, {fail} fallas")
          PY
          cp app/build/reports/lint-results-debug.txt out/ 2>/dev/null || true

      - name: Publicar APK y reportes en la rama ci-output
        if: always()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk out/profe-debug.apk 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > out/STATUS.txt
          cd out
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pruebas de interfaz en emulador (Android 14)
        id: ui
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p out
            ./gradlew --no-daemon connectedDebugAndroidTest > out/ui-build.log 2>&1 || (adb logcat -d -t 3000 > out/logcat.txt; exit 1)

      - name: Publicar resultados (rama ci-ui)
        if: always()
        run: |
          mkdir -p out
          python3 - <<'PY' > out/ui-tests.txt
          import glob, xml.etree.ElementTree as ET
          total = fail = 0
          for f in sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)):
              r = ET.parse(f).getroot()
              for tc in r.iter("testcase"):
                  total += 1
                  bad = list(tc.findall("failure")) + list(tc.findall("error"))
                  if bad:
                      fail += 1
                      print("FALLA", tc.get("classname"), tc.get("name"))
                      print((bad[0].text or "")[:3000])
                  else:
                      print("OK", tc.get("classname"), tc.get("name"), tc.get("time"))
          print(f"TOTAL UI: {total} pruebas, {fail} fallas")
          PY
          echo "${{ github.sha }} ${{ steps.ui.outcome }}" > out/STATUS.txt
          tail -60 out/ui-build.log > out/ui-build-tail.txt 2>/dev/null || true
          rm -f out/ui-build.log
          cd out
          git init -q -b ci-ui
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "UI ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-ui
